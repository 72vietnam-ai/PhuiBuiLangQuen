<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>

  <!-- Nạp phông chữ Merriweather chuẩn sách in tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    /* 1. NỀN NGOÀI TOÀN TRANG (Mặt bàn gỗ/xám kem) */
    body {
      background-color: #ede8dc;
      color: #222222;
      font-family: 'Merriweather', 'Georgia', serif;
      margin: 0;
      padding: 40px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* 2. TỜ GIẤY TRANG SÁCH NỔI TRÊN BÀN */
    .page-sheet {
      background-color: #faf6eb; /* Màu giấy sách ngả kem dịu mắt */
      max-width: 820px;          /* Độ rộng tối ưu khi đọc sách */
      width: 100%;
      padding: 50px 60px;        /* Lề trong trang sách */
      box-sizing: border-box;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid #e8e2d2;
    }

    /* 3. BANNER ĐẦU TRANG */
    .site-banner {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 3px;
      margin-bottom: 30px;
      display: block;
    }

    /* 4. TIÊU ĐỀ BÀI VIẾT */
    .story-title {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-top: 0;
      margin-bottom: 10px;
      line-height: 1.3;
      text-align: center;
    }

    .story-meta {
      font-size: 1rem;
      font-style: italic;
      color: #666666;
      text-align: center;
      margin-bottom: 40px;
      border-bottom: 1px solid #e2dcce;
      padding-bottom: 20px;
    }

    /* 5. NỘI DUNG VĂN BẢN (Chuẩn sách in) */
    .book-content {
      font-family: 'Source Serif 4', 'Lora', serif;
      font-size: 1.2rem;
      color: #222222;
    }

    .book-content p {
      line-height: 1.85;
      text-align: justify;
      margin-top: 0;
      margin-bottom: 1.6em;
      text-indent: 0; /* Không thụt lề đầu dòng */
    }

    /* 6. KHUNG CHÈN ẢNH MINH HỌA TRONG BÀI */
    .story-image-wrap {
      margin: 35px 0;
      text-align: center;
    }

    .story-image {
      max-width: 100%;
      height: auto;
      border-radius: 3px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .image-caption {
      font-size: 0.95rem;
      font-style: italic;
      color: #555555;
      margin-top: 10px;
    }

    /* 7. KHUNG LỜI BÌNH CỦA DỊCH GIẢ */
    .translator-note {
      margin-top: 50px;
      padding: 25px 30px;
      background-color: #f3edd9;
      border-left: 4px solid #8b7355;
      border-radius: 2px;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .translator-note-title {
      font-weight: 700;
      margin-bottom: 10px;
      color: #4a3b2c;
    }

    /* 8. CHÂN TRANG */
    .site-footer {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #777265;
      text-align: center;
    }

    /* Tương thích màn hình điện thoại */
    @media (max-width: 768px) {
      body {
        padding: 15px 8px;
      }
      .page-sheet {
        padding: 30px 20px;
      }
      .book-content {
        font-size: 1.1rem;
      }
      .story-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Tờ giấy trang sách chứa toàn bộ nội dung -->
  <article class="page-sheet">
    
    <!-- Banner hiển thị ở đầu bài (nếu có file Tiêu de110.png) -->
    <header>
      <img src="{{ '/Tiêu de110.png' | relative_url }}" alt="Banner Tiêu đề" class="site-banner" onerror="this.style.display='none'">
      {% if page.title %}
        <h1 class="story-title">{{ page.title }}</h1>
      {% endif %}
      {% if page.author or page.date %}
        <div class="story-meta">
          {% if page.author %}Tác giả: {{ page.author }}{% endif %}
          {% if page.date %} • {{ page.date | date: "%d/%m/%Y" }}{% endif %}
        </div>
      {% endif %}
    </header>

    <!-- Jekyll tự động bơm bài viết từ file .md vào đây -->
    {{ content }}

  </article>

  <!-- Chân trang nằm ngoài mặt bàn -->
  <footer class="site-footer">
    <p>© Blog Phủi Bụi Lãng Quên</p>
  </footer>

</body>
</html>
